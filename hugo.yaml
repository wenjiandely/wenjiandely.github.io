# PaperMod 站点配置
baseURL: "https://stabilelee.me/"
title: "Ethan"
theme: PaperMod

locale: en-US
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
hasCJKLanguage: false
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 8

# 首页额外输出 JSON，供 PaperMod 的本地搜索使用
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Ethan"
  description: "Ethan. Edge inference, privacy-preserving computing, and FPGA acceleration."
  keywords: [Ethan, edge inference, homomorphic encryption, FPGA, computer vision]
  author: Ethan

  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false
  disableLangToggle: false
  displayFullLangName: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: true
  tocopen: false

  comments: false
  hidemeta: false
  hideSummary: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  ShowFullTextinRSS: false

  # 首页仅显示梨 emoji，个人介绍见关于页
  profileMode:
    enabled: true

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/wenjiandely"
    - name: email
      title: 邮箱
      url: "mailto:stabilelee@foxmail.com"
    - name: rss
      title: RSS
      url: "index.xml"

  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

# English lives at /; Chinese lives at /zh/.
languages:
  en:
    locale: en-US
    label: English
    title: Ethan
    weight: 1
    params:
      languageAltTitle: English
    menus:
      main:
        - identifier: posts
          name: Publications
          pageRef: /posts
          weight: 10
        - identifier: projects
          name: Projects
          pageRef: /projects
          weight: 20
        - identifier: about
          name: About
          pageRef: /about
          weight: 30
        - identifier: api
          name: API
          url: https://api.stabilelee.me
          weight: 40
  zh:
    locale: zh-CN
    label: 中文
    title: "梨"
    weight: 2
    hasCJKLanguage: true
    params:
      languageAltTitle: 中文
      description: "Ethan，边缘推理、隐私计算与 FPGA 加速。"
    menus:
      main:
        - identifier: posts
          name: 论文
          pageRef: /posts
          weight: 10
        - identifier: projects
          name: 项目
          pageRef: /projects
          weight: 20
        - identifier: about
          name: 关于
          pageRef: /about
          weight: 30
        - identifier: api
          name: API
          url: https://api.stabilelee.me
          weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true

taxonomies:
  tag: tags
  category: categories
